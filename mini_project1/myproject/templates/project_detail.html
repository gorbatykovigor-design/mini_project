<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ project.name }}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            color: #333;
        }

        .project-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 30px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.12);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 25px;
        }

        .project-image {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            color: #666;
            overflow-wrap: anywhere;
        }

        .project-date {
            padding-top: 15px;
            border-top: 1px solid #eee;
            font-size: 14px;
        }

        .back-link {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 20px;
            background-color: #333;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .back-link:hover {
            background-color: #555;
        }
    </style>
</head>

<body>

    <div class="project-container">

        <h1>{{ project.name }}</h1>

        {% if project.picure %}
            <img
                class="project-image"
                src="{{ project.picure.url }}"
                alt="{{ project.name }}"
            >
        {% endif %}

        <h2>Опис проєкту</h2>
        <p>{{ project.description }}</p>

        <h2>Технології</h2>
        <p>{{ project.tech }}</p>

        <p class="project-date">
            <strong>Дата створення:</strong>
            {{ project.date|date:"d.m.Y" }}
        </p>

        <a href="/asd/projects/" class="back-link">
            Назад до проєктів
        </a>

    </div>

</body>
</html>
