
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мої навички | DevPortfolio</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 20px;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            color: #333;
        }

        nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 40px;
        }

        nav a {
            padding: 12px 20px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 9px;
            transition: .3s;
        }

        nav a:hover {
            background: #555;
            transform: translateY(-2px);
        }

        h1 {
            text-align: center;
            margin-bottom: 15px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 40px;
        }

        .skills-container {
            max-width: 850px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .skill-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,.12);
            transition: .3s;
        }

        .skill-card:hover {
            transform: translateY(-5px);
        }

        .skill-card h2 {
            margin-top: 0;
        }

        .skill {
            margin: 20px 0;
        }

        .skill-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .progress {
            width: 100%;
        }

        .progress progress {
            width: 100%;
            height: 12px;
            accent-color: #555;
        }

        .back {
            display: block;
            width: fit-content;
            margin: 35px auto 0;
            padding: 13px 25px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 9px;
            transition: .3s;
        }

        .back:hover {
            background: #555;
        }
    </style>
</head>

<body>

    <nav>
        <a href="{% url 'home' %}">Головна</a>
        <a href="{% url 'project' %}">Проєкти</a>
        <a href="{% url 'skill' %}">Навички</a>
        <a href="{% url 'expirience' %}">Досвід</a>
        <a href="{% url 'pricing' %}">Прайсинг</a>
        <a href="{% url 'about' %}">Про мене</a>
    </nav>

    <h1>Мої навички</h1>

    <p class="subtitle">
        Технології та інструменти, з якими я працюю
    </p>

    <div class="skills-container">

        {% for skill in skills %}
            <div class="skill-card">

                <h2>{{ skill.category }}</h2>

                <div class="skill">

                    <div class="skill-info">
                        <span>{{ skill.name }}</span>
                        <span>{{ skill.lvlpossesses }}/10</span>
                    </div>

                    <div class="progress">
                        <div class="progress">
                            <progress max="10" value="{{ skill.lvlpossesses }}"></progress>
                        </div>
                    </div>

                </div>

            </div>

        {% empty %}

            <div class="skill-card">
                <h2>Навички</h2>
                <p>Навички поки не додані.</p>
            </div>

        {% endfor %}

    </div>

    <a href="{% url 'home' %}" class="back">
        На головну
    </a>

</body>
</html>
